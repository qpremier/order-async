name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://orderrelay:orderrelay@localhost:5432/orderrelay_test?schema=public
      REDIS_URL: redis://localhost:6379
      SHOPIFY_API_KEY: ci_test_key
      SHOPIFY_API_SECRET: ci_test_secret
      SHOPIFY_APP_URL: https://orderrelay-ci.example.com
      SCOPES: read_products,read_orders,write_orders

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderrelay
          POSTGRES_PASSWORD: orderrelay
          POSTGRES_DB: orderrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderrelay -d orderrelay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production artifacts
        run: npm run build
